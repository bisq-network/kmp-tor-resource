name: CI

on: [ pull_request ]

# Artifacts are looked up and downloaded through the REST API. A PAT_ACTION_READ secret is
# used when present; otherwise the workflow token, which is what a pull request from a fork
# gets (read-only), so contributors' PRs can still run the full matrix.
permissions:
  actions: read
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.incremental=false -Dorg.gradle.jvmargs="-XX:+HeapDumpOnOutOfMemoryError -XX:MetaspaceSize=1g"

jobs:
  compile-task:
    strategy:
      fail-fast: false
      matrix:
        task-target: [ geoip, android, ios, linux-libc, linux-musl, macos, mingw ]
    runs-on: ubuntu-latest
    outputs:
      id-geoip: ${{ steps.output-artifact-id.outputs.id-geoip }}
      id-android: ${{ steps.output-artifact-id.outputs.id-android }}
      id-ios: ${{ steps.output-artifact-id.outputs.id-ios }}
      id-linux-libc: ${{ steps.output-artifact-id.outputs.id-linux-libc }}
      id-linux-musl: ${{ steps.output-artifact-id.outputs.id-linux-musl }}
      id-macos: ${{ steps.output-artifact-id.outputs.id-macos }}
      id-mingw: ${{ steps.output-artifact-id.outputs.id-mingw }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ResourceValidation extensions have expected sha256 hashes for all
      # external resources and/or libs. Hash the .kt files and use as a
      # key in order to restore artifacts if nothing has changed.
      - name: Hash ResourceValidation Extensions
        run: |
          HASHES=""
          cd "build-logic/src/main/kotlin/resource/validation/extensions"
          for FILE in $(ls); do
            if [ ! -f "$FILE" ]; then continue; fi
            if [ "$FILE" = "AbstractResourceValidationExtension.kt" ]; then continue; fi
            HASHES+="$(sha256sum "$FILE" | cut -d ' ' -f 1)"
          done
          # The packaging scripts shape the artifacts too (e.g. how Apple binaries are signed),
          # so a change to them must not be served from a stale artifact.
          cd "$GITHUB_WORKSPACE"
          for FILE in external/task.sh external/source.task/*.sh; do
            HASHES+="$(sha256sum "$FILE" | cut -d ' ' -f 1)"
          done
          COMBINED="$(echo "$HASHES" | sha256sum - | cut -d ' ' -f 1)"
          echo "rv-hash=$COMBINED" >> "$GITHUB_ENV"

      - name: Check For Existing Artifact
        run: |
          ARTIFACT_ID=$(
            curl -L \
              -H "Accept: application/vnd.githubm+json" \
              -H "Authorization: Bearer ${{ secrets.PAT_ACTION_READ || github.token }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?page=1&per_page=1&name=${{ env.rv-hash }}-${{ matrix.task-target }}" |
              jq '.artifacts | .[0] | select(.expired==false) | .id'
          )
          echo "artifact-id=$ARTIFACT_ID" >> "$GITHUB_ENV"

      - name: Validate Gradle Wrapper
        if: env.artifact-id == ''
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup JDK
        if: env.artifact-id == ''
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 11

      - name: Build Task Target
        if: env.artifact-id == '' && matrix.task-target != 'geoip'
        run: >
          ./external/task.sh "build:all:${{ matrix.task-target }}"

      # Detached code signatures in external/codesign can only be regenerated by the
      # maintainer. This fork ad-hoc signs the Apple compilations and leaves Windows unsigned.
      # Ad-hoc signing of the Apple compilations at packaging (see --adhoc-codesign). Pinned
      # release of apple-codesign, verified against its published checksum.
      - name: Install rcodesign
        if: env.artifact-id == '' && matrix.task-target != 'geoip'
        run: |
          VERSION="0.29.0"
          SHA256="dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002"
          curl -sSL -o rcodesign.tar.gz "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F$VERSION/apple-codesign-$VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$SHA256  rcodesign.tar.gz" | sha256sum -c -
          tar -xzf rcodesign.tar.gz
          sudo install -m 0755 "apple-codesign-$VERSION-x86_64-unknown-linux-musl/rcodesign" /usr/local/bin/rcodesign
          rcodesign --version

      - name: Package Task Target
        if: env.artifact-id == ''
        run: >
          ./external/task.sh "package:${{ matrix.task-target }}" --adhoc-codesign

      - name: Tar Package Directory
        if: env.artifact-id == ''
        run: >
          tar -czf ${{ matrix.task-target }}.tar.gz external/build/package

      - name: Upload Artifact
        if: env.artifact-id == ''
        id: upload-artifact-step
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.rv-hash }}-${{ matrix.task-target }}
          path: |
            external/build/stage/*/*/*/logs/**
            ${{ matrix.task-target }}.tar.gz
          if-no-files-found: error
          overwrite: false

      - name: Set Artifact ID ENV
        if: env.artifact-id == ''
        run: >
          echo "artifact-id=${{ steps.upload-artifact-step.outputs.artifact-id }}" >> "$GITHUB_ENV"

      - name: Output Artifact ID
        id: output-artifact-id
        run: |
          if [ -z "${{ env.artifact-id  }}" ]; then
            echo "Environment Variable artifact-id is empty..."
            exit 3
          fi
          echo "id-${{ matrix.task-target }}=${{ env.artifact-id }}" >> "$GITHUB_OUTPUT"

  # Bisq fork: matrix trimmed to what Bisq publishes. JS/Wasm tests need npm packages that
  # only upstream publishes, and the macOS/tvOS/watchOS binaries are unsigned in this fork.
  check:
    needs: compile-task
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java-version: 19
            targets: ANDROID,ANDROID_ARM32,ANDROID_ARM64,ANDROID_X64,ANDROID_X86,JVM,LINUX_ARM64,LINUX_X64
          - os: windows-latest
            java-version: 19
            targets: JVM,MINGW_X64
          - os: macos-latest
            java-version: 19
            targets: IOS_ARM64,IOS_X64,IOS_SIMULATOR_ARM64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java-version }}

      - name: Download Native Compilation Artifacts
        shell: bash
        run: |
          ./.github/workflows/download_artifact.sh "${{ secrets.PAT_ACTION_READ || github.token }}" "geoip" "${{ needs.compile-task.outputs.id-geoip }}"
          ./.github/workflows/download_artifact.sh "${{ secrets.PAT_ACTION_READ || github.token }}" "android" "${{ needs.compile-task.outputs.id-android }}"
          ./.github/workflows/download_artifact.sh "${{ secrets.PAT_ACTION_READ || github.token }}" "ios" "${{ needs.compile-task.outputs.id-ios }}"
          ./.github/workflows/download_artifact.sh "${{ secrets.PAT_ACTION_READ || github.token }}" "linux-libc" "${{ needs.compile-task.outputs.id-linux-libc }}"
          ./.github/workflows/download_artifact.sh "${{ secrets.PAT_ACTION_READ || github.token }}" "linux-musl" "${{ needs.compile-task.outputs.id-linux-musl }}"
          ./.github/workflows/download_artifact.sh "${{ secrets.PAT_ACTION_READ || github.token }}" "macos" "${{ needs.compile-task.outputs.id-macos }}"
          ./.github/workflows/download_artifact.sh "${{ secrets.PAT_ACTION_READ || github.token }}" "mingw" "${{ needs.compile-task.outputs.id-mingw }}"

      - name: Validate Native Compilations
        shell: bash
        run: |
          VALIDATE_OUTPUT="$(./external/task.sh validate)"
          if echo "$VALIDATE_OUTPUT" | grep "ERROR"; then exit 1; fi

      - name: Check API Compatibility
        if: matrix.os == 'ubuntu-latest'
        run: >
          ./gradlew apiCheck --stacktrace
          -PKMP_TARGETS="${{ matrix.targets }}"

      - name: Run Tests
        run: >
          ./gradlew check --stacktrace
          -PKMP_TARGETS="${{ matrix.targets }}"

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-${{ matrix.os }}-java${{ matrix.java-version }}
          path: '**/build/reports/tests/**'
          retention-days: 1

  android-check:
    needs: compile-task
    strategy:
      fail-fast: false
      matrix:
        # Bisq fork: from the lowest API level a Bisq app supports (Connect minSdk 24).
        api-level: [ 24, 25, 29, 30, 31, 32, 33, 34, 35 ]
    runs-on: ubuntu-latest
    steps:
      - name: Remove unnecessary tools
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          tool-cache: true
          dotnet: true
          haskell: true
          swap-storage: true
          docker-images: false
          large-packages: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Download Native Compilations
        run: |
          ./.github/workflows/download_artifact.sh "${{ secrets.PAT_ACTION_READ || github.token }}" "geoip" "${{ needs.compile-task.outputs.id-geoip }}"
          ./.github/workflows/download_artifact.sh "${{ secrets.PAT_ACTION_READ || github.token }}" "android" "${{ needs.compile-task.outputs.id-android }}"
          cd external/build/package
          rm -rf resource-exec-tor/src/jvmMain/resources
          rm -rf resource-exec-tor-gpl/src/jvmMain/resources
          rm -rf resource-noexec-tor/src/jvmMain/resources
          rm -rf resource-noexec-tor-gpl/src/jvmMain/resources
          rm -rf resource-lib-tor/src/jvmMain/resources
          rm -rf resource-lib-tor-gpl/src/jvmMain/resources

      - name: Run Android Instrumented Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-boot-timeout: 300 # 5 minutes
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          script: ./gradlew connectedCheck -PKMP_TARGETS="ANDROID,ANDROID_ARM32,ANDROID_ARM64,ANDROID_X64,ANDROID_X86,JVM"

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-android-${{ matrix.api-level }}
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/connected/debug/*/logcat-*.txt
          retention-days: 1

  linux-check:
    needs: compile-task
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            distro: ubuntu16.04
            expected-host: linux-libc
            expected-arch: aarch64
            java-version: 8
          - arch: aarch64
            distro: alpine_latest
            expected-host: linux-musl
            expected-arch: aarch64
            java-version: 21
          - arch: armv7
            distro: ubuntu16.04
            expected-host: linux-libc
            expected-arch: armv7
            java-version: 8
          - arch: ppc64le
            distro: ubuntu16.04
            expected-host: linux-libc
            expected-arch: ppc64
            java-version: 8
          - arch: riscv64
            distro: ubuntu20.04
            expected-host: linux-libc
            expected-arch: riscv64
            java-version: 11
          - arch: i386
            distro: _
            expected-host: linux-musl
            expected-arch: x86
            java-version: 8
          - arch: amd64
            distro: _
            expected-host: linux-musl
            expected-arch: x86_64
            java-version: 8
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 11

      - name: Download Native Compilation Artifacts
        shell: bash
        run: |
          ./.github/workflows/download_artifact.sh "${{ secrets.PAT_ACTION_READ || github.token }}" "geoip" "${{ needs.compile-task.outputs.id-geoip }}"
          ./.github/workflows/download_artifact.sh "${{ secrets.PAT_ACTION_READ || github.token }}" "android" "${{ needs.compile-task.outputs.id-android }}"
          ./.github/workflows/download_artifact.sh "${{ secrets.PAT_ACTION_READ || github.token }}" "linux-libc" "${{ needs.compile-task.outputs.id-linux-libc }}"
          ./.github/workflows/download_artifact.sh "${{ secrets.PAT_ACTION_READ || github.token }}" "linux-musl" "${{ needs.compile-task.outputs.id-linux-musl }}"
          ./.github/workflows/download_artifact.sh "${{ secrets.PAT_ACTION_READ || github.token }}" "macos" "${{ needs.compile-task.outputs.id-macos }}"
          ./.github/workflows/download_artifact.sh "${{ secrets.PAT_ACTION_READ || github.token }}" "mingw" "${{ needs.compile-task.outputs.id-mingw }}"

      - name: Assemble test-linux.jar
        run: >
          ./gradlew :test-linux:assembleFatJar
          -PKMP_TARGETS="JVM"

      - name: Run tor
        uses: uraimo/run-on-arch-action@v3
        if: matrix.distro != '_'
        with:
          arch: ${{ matrix.arch }}
          distro: ${{ matrix.distro }}
          githubToken: ${{ github.token }}
          dockerRunArgs: |
            -v "${PWD}/test-linux/build:/work"
            -u "$(id -u):$(id -g)"
          install: |
            case "${{ matrix.distro }}" in
              ubuntu*)
                apt-get update -q -y
                apt-get install -q -y openjdk-${{ matrix.java-version }}-jre-headless
                ;;
              alpine*)
                apk update
                apk add openjdk${{ matrix.java-version }}
                ;;
              *)
                echo 1>&2 "Host not configured..."
                exit 2
                ;;
            esac
          run: |
            cd /work
            java -jar libs/test-linux.jar "10" "${{ matrix.expected-host }}" "${{ matrix.expected-arch }}" "./test_linux/${{ matrix.expected-arch }}"

      - name: Build Alpine Container
        if: matrix.distro == '_'
        run: >
          docker build
          -f "${PWD}/.github/docker/Dockerfile"
          --build-arg ARCH=${{ matrix.arch }}
          -t TestLinux/tor.alpine.${{ matrix.arch }}
          "${PWD}/.github/docker"

      - name: Run tor On Alpine
        if: matrix.distro == '_'
        run: >
          docker run --rm
          --pull never
          -v "${PWD}/test-linux/build:/work"
          -u "$(id -u):$(id -g)"
          TestLinux/tor.alpine.${{ matrix.arch }}:latest
          sh -c 'java -jar libs/test-linux.jar "10" "${{ matrix.expected-host }}" "${{ matrix.expected-arch }}" "./test_linux/${{ matrix.expected-arch }}"'
