org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.parallel=true

android.useAndroidX=true
android.enableJetifier=true

kotlin.code.style=official
kotlin.mpp.applyDefaultHierarchyTemplate=false
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.stability.nowarn=true
kotlin.native.ignoreDisabledTargets=true

SONATYPE_HOST=CENTRAL_PORTAL
RELEASE_SIGNING_ENABLED=true

# Bisq fork: published under a Bisq group id so nothing can collide with or shadow the
# upstream io.matthewnelson.kmp-tor coordinates on Maven Central. Package names, artifact
# ids and plugin ids are unchanged, so consumers only swap the group.
GROUP=network.bisq.kmp-tor

POM_INCEPTION_YEAR=2021

POM_URL=https://github.com/bisq-network/kmp-tor-resource/
POM_SCM_URL=https://github.com/bisq-network/kmp-tor-resource/
POM_SCM_CONNECTION=scm:git:git://github.com/bisq-network/kmp-tor-resource.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/bisq-network/kmp-tor-resource.git

POM_LICENCE_NAME=The Apache Software License, Version 2.0
POM_LICENCE_URL=https://www.apache.org/licenses/LICENSE-2.0.html
POM_LICENCE_DIST=repo

POM_DEVELOPER_ID=05nelsonm
POM_DEVELOPER_NAME=Matthew Nelson
POM_DEVELOPER_URL=https://github.com/05nelsonm/

NPMJS_SNAPSHOT_VERSION=0
VERSION_NAME=409.13.0-SNAPSHOT
# 406.9.0 == 0406_09_00
# 406.9.1 == 0406_09_01
# 407.3.2 == 0407_03_02
VERSION_CODE=04091300
